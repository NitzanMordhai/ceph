teuthology:
  postmerge:
    - |
      -- skip squid install+dencoder on rocky - squid packages not available
      if yaml.os_type == 'rocky' then
        yaml.squid_tasks = yaml_load([=[sequential: []]=])
      end

squid_tasks:
  sequential:
    - print: "**** installing N-2 version (squid) ****"
    - install:
        branch: squid
        exclude_packages:
          - ceph-volume
          - ceph-osd-classic
          - ceph-osd-crimson
    - print: "**** start dencoder squid... ****"
    - workunit:
        clients:
          client.0:
            - dencoder/test-dencoder.sh
    - print: "**** done dencoder squid ****"

tasks:
- sequential:
    - squid_tasks

- print: "**** installing N-1 version (tentacle) ****"
- install:
    branch: tentacle
    exclude_packages:
      - ceph-volume
      - ceph-osd-classic
- print: "**** start dencoder tentacle... ****"
- workunit:
    clients:
      client.0:
        - dencoder/test-dencoder.sh
- print: "**** done dencoder tentacle ****"

- print: "**** installing N version (umbrella) ****"
- install:
    branch: umbrella
    exclude_packages:
      - ceph-volume
      - ceph-osd-classic
- print: "**** start dencoder umbrella... ****"
- workunit:
    clients:
      client.0:
        - dencoder/test-dencoder.sh
- print: "**** done dencoder umbrella ****"
