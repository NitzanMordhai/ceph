# Everything random-objectstore$ rolls at random, pinned. A perf
# comparison has to differ in one thing only, and an allocator, memory
# target or compression setting drawn independently per job moves the
# numbers by more than the effect being measured.
overrides:
  ceph:
    fs: xfs
    conf:
      osd:
        osd objectstore: bluestore
        bluestore block size: 96636764160
        bluestore fsck on mount: true
        bluestore allocator: bitmap
        osd memory target: 4294967296
        bluestore onode segment size: 0
        bluestore debug onode segmentation random: false
        bluestore write v2: true
        bluestore compression mode: none
        bdev enable discard: true
        bdev async discard: true
        osd failsafe full ratio: .95
      mon:
        mon osd full ratio: .9
        mon osd backfillfull_ratio: .85
        mon osd nearfull ratio: .8
