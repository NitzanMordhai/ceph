# Every mgr module, prometheus included, in the main interpreter.
overrides:
  ceph:
    conf:
      mgr:
        mgr_subinterpreter_modules: ""
tasks:
  - exec:
      client.0:
        - ceph osd pool create mgrperf 256 256 --autoscale-mode=off
        - ceph osd pool application enable mgrperf rados
  - mgr_perf:
      interval: 30
      warmup: 120
  - radosbench:
      clients: [client.0]
      pool: mgrperf
      create_pool: false
      time: 900
      size: 4096
